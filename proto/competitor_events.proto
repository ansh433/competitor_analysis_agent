syntax = "proto3";

package competitor_intelligence.streaming.v1;

message ConversationIdentified {
  string conversation_id = 1;
}

message ResearchRunIdentified {
  string research_run_id = 1;
}

message TextChunk {
  string text = 1;
  bool is_final_chunk = 2;
}

message GraphStageEvent {
  string stage_name = 1;
  int32 stage_index = 2;
  string detail = 3;
}

message ToolStarted {
  string execution_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message ToolEnded {
  string execution_id = 1;
  string tool_name = 2;
  string output_json = 3;
  int64 execution_time_ms = 4;
  bool success = 5;
}

message SourceDiscovered {
  string source_id = 1;
  string title = 2;
  string url = 3;
  string publisher = 4;
}

message EvidenceEvent {
  string evidence_id = 1;
  string claim = 2;
  string source_url = 3;
  string reason = 4;
  double confidence = 5;
}

message ResearchGapFound {
  string gap_id = 1;
  string question = 2;
  string report_section = 3;
}

message ComparisonArtifact {
  string comparison_id = 1;
  string structured_result_json = 2;
}

message FinalReportArtifact {
  string research_run_id = 1;
  string report_markdown = 2;
  double confidence_score = 3;
  double coverage_score = 4;
}

message StreamError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message StreamFinished {
  bool success = 1;
}

message StreamEvent {
  string event_id = 1;
  string timestamp = 2;
  oneof payload {
    ConversationIdentified conversation_identified = 3;
    ResearchRunIdentified research_run_identified = 4;
    TextChunk text_chunk = 5;
    GraphStageEvent graph_stage_started = 6;
    GraphStageEvent graph_stage_ended = 7;
    ToolStarted tool_started = 8;
    ToolEnded tool_ended = 9;
    SourceDiscovered source_discovered = 10;
    EvidenceEvent evidence_accepted = 11;
    EvidenceEvent evidence_rejected = 12;
    ResearchGapFound research_gap_found = 13;
    ComparisonArtifact comparison_artifact = 14;
    FinalReportArtifact final_report_artifact = 15;
    StreamError error = 16;
    StreamFinished finished = 17;
  }
}

